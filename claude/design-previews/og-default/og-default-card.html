<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Oswald;src:url(oswald-latin.woff2) format('woff2');font-weight:200 700}
@font-face{font-family:Plex;src:url(ibm-plex-sans-latin.woff2) format('woff2');font-weight:100 700}
@font-face{font-family:Mono;src:url(ibm-plex-mono-latin-500.woff2) format('woff2');font-weight:500}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#121011;color:#f2eeee;font-family:Plex;position:relative;overflow:hidden}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:48px 48px}
.glow{position:absolute;right:-220px;top:-260px;width:820px;height:820px;background:radial-gradient(closest-side,rgba(153,0,0,.42),transparent)}
.bar{position:absolute;left:0;top:0;bottom:0;width:10px;background:#990000}
.in{position:absolute;left:84px;right:84px;top:72px;bottom:64px;display:flex;flex-direction:column}
img{height:46px;width:auto;align-self:flex-start}
.ey{margin-top:58px;font-family:Mono;font-size:20px;letter-spacing:.2em;text-transform:uppercase;color:#e23b3b}
h1{margin-top:18px;font-family:Oswald;font-weight:600;font-size:76px;line-height:1.02;text-transform:uppercase;letter-spacing:.005em;max-width:960px}
h1 span{color:#e23b3b}
.ft{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;border-top:1px solid #3a3130;padding-top:22px;font-size:22px;color:#b8b0b1}
.ft b{font-family:Mono;font-weight:500;font-size:20px;letter-spacing:.08em;color:#f2eeee}
</style></head><body><div class="grid"></div><div class="glow"></div><div class="bar"></div>
<div class="in"><img src="logo-white.webp" alt="">
<div class="ey">[ AI Growth Systems ]</div>
<h1>Automate operations.<br>Improve search visibility.<br><span>Increase revenue.</span></h1>
<div class="ft"><span>Website, content and search connected into one growth engine</span><b>reinforcelab.com</b></div></div>
</body></html>
